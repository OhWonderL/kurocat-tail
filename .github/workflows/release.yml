name: Windows x64 installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: npm ci
      - run: node scripts/check-tail.mjs
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri -- build --target x86_64-pc-windows-msvc --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: KuroCat-Tail-Windows-x64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
